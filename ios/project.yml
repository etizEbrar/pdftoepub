name: PDFtoEPUB
options:
  bundleIdPrefix: com.pdftoepub
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Needed for on-device builds. Regenerating the project would otherwise drop
    # the team Xcode assigned, and the next device build fails to sign.
    # Override with `xcodebuild DEVELOPMENT_TEAM=...` for a different account.
    DEVELOPMENT_TEAM: "23766BZUS5"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages: {}

targets:
  PDFtoEPUB:
    type: application
    platform: iOS
    sources:
      - path: PDFtoEPUB
    resources:
      - path: PDFtoEPUB/Resources
    info:
      path: PDFtoEPUB/Resources/Info.plist
      properties:
        CFBundleDisplayName: PDF to EPUB
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # A physical device reaches the development backend over the local
        # network by IP address, which plain ATS blocks. NSAllowsLocalNetworking
        # permits http to local addresses only — it does not weaken transport
        # security for anything on the public internet.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
        NSLocalNetworkUsageDescription: PDF to EPUB connects to the conversion server you run on your own computer to convert your PDFs.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pdftoepub.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies: []

  PDFtoEPUBTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PDFtoEPUBTests
    dependencies:
      - target: PDFtoEPUB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pdftoepub.tests
        GENERATE_INFOPLIST_FILE: YES

  PDFtoEPUBUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PDFtoEPUBUITests
    dependencies:
      - target: PDFtoEPUB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pdftoepub.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PDFtoEPUB:
    build:
      targets:
        PDFtoEPUB: all
        PDFtoEPUBTests: [test]
        PDFtoEPUBUITests: [test]
    test:
      targets:
        - PDFtoEPUBTests
        - PDFtoEPUBUITests
    run:
      config: Debug
