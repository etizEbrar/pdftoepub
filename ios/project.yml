name: PDFtoEPUB
options:
  bundleIdPrefix: com.pdftoepub
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Needed for on-device builds. Regenerating the project would otherwise drop
    # the team Xcode assigned, and the next device build fails to sign.
    # Override with `xcodebuild DEVELOPMENT_TEAM=...` for a different account.
    DEVELOPMENT_TEAM: "23766BZUS5"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "6"
    # Address of the hosted conversion backend. Deliberately empty: no backend
    # is deployed yet, and shipping a placeholder would produce a build that
    # fails mysteriously instead of one that asks the user for an address.
    # Set it here (or pass PRODUCTION_BACKEND_URL=... to xcodebuild) once a
    # public HTTPS endpoint exists.
    PRODUCTION_BACKEND_URL: "https://pdftoepub-backend.onrender.com"

packages: {}

targets:
  PDFtoEPUB:
    type: application
    platform: iOS
    sources:
      - path: PDFtoEPUB
    resources:
      - path: PDFtoEPUB/Resources
    info:
      path: PDFtoEPUB/Resources/Info.plist
      properties:
        CFBundleDisplayName: PDF to EPUB
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # A physical device reaches the development backend over the local
        # network by IP address, which plain ATS blocks. NSAllowsLocalNetworking
        # permits http to local addresses only — it does not weaken transport
        # security for anything on the public internet.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
        NSLocalNetworkUsageDescription: PDF to EPUB connects to the conversion server you run on your own computer to convert your PDFs.
        ITSAppUsesNonExemptEncryption: false
        # Asked only so the Send to Kindle button can word itself correctly when
        # Kindle is present. Without the entry canOpenURL always answers false,
        # which degrades to offering the share sheet — never to a broken button.
        LSApplicationQueriesSchemes:
          - kindle
          - ebook
        # Follow the build settings rather than carrying their own copy. A
        # literal here silently overrode CURRENT_PROJECT_VERSION, so bumping the
        # build number produced an archive still stamped with the old one.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # App Store validation rejects a binary without this at the top level.
        # actool only writes it nested inside CFBundleIcons, so state it here.
        CFBundleIconName: AppIcon
        PRODUCTION_BACKEND_URL: $(PRODUCTION_BACKEND_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pdftoepub.app
        # iPhone only. iPad was enabled by default but no iPad layout work was
        # ever done and no iPad test has ever run, so shipping it would mean
        # submitting a stretched iPhone UI — a common rejection under
        # Guideline 4.0 — and would additionally require a separate set of iPad
        # screenshots. Re-enable as "1,2" once the layout is actually designed
        # and tested for a large screen.
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
          VALIDATE_PRODUCT: YES
    dependencies: []

  PDFtoEPUBTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PDFtoEPUBTests
    dependencies:
      - target: PDFtoEPUB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pdftoepub.tests
        GENERATE_INFOPLIST_FILE: YES

  PDFtoEPUBUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PDFtoEPUBUITests
    # An explicit plist rather than a generated one, so the backend address can
    # be baked in. A device run must be told where the backend is: on real
    # hardware "localhost" is the phone itself. Empty here keeps the simulator
    # suite on localhost; set UITEST_BACKEND_URL before `xcodegen generate`.
    info:
      path: PDFtoEPUBUITests/Info.plist
      properties:
        UITestBackendURL: ${UITEST_BACKEND_URL}
    dependencies:
      - target: PDFtoEPUB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pdftoepub.uitests

schemes:
  PDFtoEPUB:
    build:
      targets:
        PDFtoEPUB: all
        PDFtoEPUBTests: [test]
        PDFtoEPUBUITests: [test]
    test:
      targets:
        - PDFtoEPUBTests
        - PDFtoEPUBUITests
    run:
      config: Debug
