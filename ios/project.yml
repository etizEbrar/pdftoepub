name: PDFtoEPUB
options:
  bundleIdPrefix: com.pdftoepub
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages: {}

targets:
  PDFtoEPUB:
    type: application
    platform: iOS
    sources:
      - path: PDFtoEPUB
    resources:
      - path: PDFtoEPUB/Resources
    info:
      path: PDFtoEPUB/Resources/Info.plist
      properties:
        CFBundleDisplayName: PDF to EPUB
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pdftoepub.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: true
    dependencies: []

  PDFtoEPUBTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PDFtoEPUBTests
    dependencies:
      - target: PDFtoEPUB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pdftoepub.tests
        GENERATE_INFOPLIST_FILE: YES

  PDFtoEPUBUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PDFtoEPUBUITests
    dependencies:
      - target: PDFtoEPUB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pdftoepub.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PDFtoEPUB:
    build:
      targets:
        PDFtoEPUB: all
        PDFtoEPUBTests: [test]
        PDFtoEPUBUITests: [test]
    test:
      targets:
        - PDFtoEPUBTests
        - PDFtoEPUBUITests
    run:
      config: Debug
